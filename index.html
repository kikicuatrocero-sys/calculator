<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <h1>Calculator</h1>
    <button id="reset">Reset</button>
    <div class="container-calculator">
        <div class="header-calculator">
            <div class="content">
                <p id="input">0</p>
            </div>
        </div>
        <div class="body-calculator">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>
            <button>.</button>
            <button>0</button>
            <button>=</button>
            <button>/</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
